edition = "2024"
description = "A small macOS desktop app for downloading S3 objects with the AWS CLI."

[dependencies]
chrono = "0.4"
gpui-kit = "0.7.3"
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }
